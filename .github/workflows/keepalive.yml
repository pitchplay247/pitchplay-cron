name: keepalive
on:
    schedule:
        - cron: "7,17,27,37,47,57 6-20 * * *" # UTC = 7:00-21:57 WAT
    workflow_dispatch:
jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping health endpoint
              env:
                  HEALTH_URL: ${{ secrets.HEALTH_URL }}
              run: curl -fsS -m 60 --retry 2 -o /dev/null "$HEALTH_URL"
